services:
  postgres:
    image: postgres:16-alpine
    container_name: notmysim_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notmysim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notmysim_secret}
      POSTGRES_DB: ${POSTGRES_DB:-notmysim}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notmysim}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
