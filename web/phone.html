<div class="border-[6px] border-gray-800 rounded-3xl w-64 h-[400px] bg-black flex flex-col overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)] relative">
    <div class="bg-gray-900 text-center py-2 text-xs text-gray-400 font-bold border-b border-gray-800 flex justify-between px-4 items-center">
        <span>15:04</span>
        <div class="flex gap-1"><span class="block w-1.5 h-1.5 bg-gray-500 rounded-full"></span><span class="block w-1.5 h-2 bg-gray-500 rounded-full"></span><span class="block w-1.5 h-3 bg-white rounded-full"></span></div>
    </div>
    <div class="flex-1 p-3 flex flex-col gap-2 overflow-y-auto">
        {{if .Message}}
        <div class="bg-gray-800 text-gray-200 p-2 rounded-lg text-xs self-start w-5/6 shadow-md relative">
            <!-- Tail for the bubble -->
            <div class="absolute -left-1 top-2 w-2 h-2 bg-gray-800 transform rotate-45"></div>
            <p class="text-blue-400 font-bold mb-1">Not-My-SIM</p>
            {{.Message}}
            <p class="text-[9px] text-gray-500 mt-1 text-right">{{.Time}}</p>
        </div>
        <div class="flex gap-2 mt-2">
            <button hx-post="/webhooks/sms" hx-vals='{"from":"{{.To}}", "text":"1"}' hx-swap="none" onclick="this.innerHTML='Sent'; this.classList.add('opacity-50')" class="flex-1 bg-green-900/50 hover:bg-green-800 text-green-300 border border-green-700 text-[10px] font-bold py-2 rounded transition active:scale-95 shadow">REPLY 1 (Approve)</button>
            <button hx-post="/webhooks/sms" hx-vals='{"from":"{{.To}}", "text":"2"}' hx-swap="none" onclick="this.innerHTML='Sent'; this.classList.add('opacity-50')" class="flex-1 bg-red-900/50 hover:bg-red-800 text-red-300 border border-red-700 text-[10px] font-bold py-2 rounded transition active:scale-95 shadow">REPLY 2 (Block)</button>
        </div>
        {{else}}
        <div class="text-center text-gray-700 text-xs mt-10">No recent messages</div>
        {{end}}
    </div>
    <!-- Home button bar -->
    <div class="h-6 bg-black flex justify-center items-center pb-1">
        <div class="w-20 h-1 bg-gray-700 rounded-full"></div>
    </div>
</div>
